<!doctype html>
<html lang="pt" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Novo Funcionario - Firebase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="h1-box">Registrar Novo Funcionario</h1>
      <form id="formFuncionario">
        <input type="text" id="nome" placeholder="Nome Completo" required />
        <input type="text" id="morada" placeholder="Endereço" required />

        <input type="text" id="cargo" placeholder="Cargo" required />

        <select id="departamento" required>
          <option id="Selecionar">Selecione um Departamento</option>
          <option value="dep1">Desenvolvimento</option>
          <option value="dep2">Design e UX</option>
        </select>

        <div class="secao-contato">
          <p>Dados de contato</p>
          <input type="email" id="email" placeholder="E-mail" required />
          <input
            type="tel"
            id="telefonePessoal"
            placeholder="Celular Pessoal"
          />
          <input type="tel" id="telefoneFixo" placeholder="Telefone fixo" />
          <input
            type="tel"
            id="telefoneTrabalho"
            placeholder="Celular trabalho"
          />
        </div>

        <button type="submit" id="btnGravar">Salvar</button>

        <a href="index.html" class="voltar">Voltar a lista</a>
      </form>
    </div>
    <script type="module" src="app-create.js"></script>
  </body>
</html>

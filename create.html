<!doctype html>
<html lang="pt"  data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Novo Funcionário - Firebase</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1>Registar Novo Funcionário</h1>
      <form id="formFuncionario">
        <input type="text" id="nome" placeholder="Nome Completo" required />
        <input type="text" id="morada" placeholder="Morada" required />
        <fieldset>
          <legend>Contactos</legend>
          <input type="email" id="email" placeholder="E-mail" required />
          <input
            type="tel"
            id="telemovelPessoal"
            placeholder="Telemóvel Pessoal"
          />
          <input type="tel" id="telefoneFixo" placeholder="Telefone Fixo" />
          <input
            type="tel"
            id="telemovelTrabalho"
            placeholder="Telemóvel Trabalho"
          />
        </fieldset>
        <button type="submit" id="btnGravar">Gravar na Cloud</button>
        <a href="index.html">Voltar à lista</a>
      </form>
    </div>
    <script type="module" src="app-create.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

<!doctype html>
<html lang="pt" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Funcionários - Firebase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 class="h1-box">Gestão de Informações dos Funcionários</h1>
    </header>

    <div class="container">
      <div class="header-acoes">
        <h1 class="text-center">Lista de Funcionários</h1>
        <button class="btn btn-success" id="btn-tempo-real">
          Ativar Tempo Real
        </button>

        <div class="busca-bloco mt-3">
          <input
            type="text"
            id="searchBar"
            placeholder="Pesquisar por nome"
            class="form-control"
          />
        </div>

        <div class="filtros-bloco mt-3 d-flex gap-2">
          <div>
            <label>Ordenar:</label>
            <select id="ordenarTempo" class="form-select">
              <option value="desc">Mais recente</option>
              <option value="asc">Mais antigo</option>
            </select>
          </div>

          <div>
            <label>Departamento:</label>
            <select id="filtroDepartamento" class="form-select">
              <option value="">Todos</option>
              <option value="Desenvolvimento">Desenvolvimento</option>
              <option value="UI/UX">UI/UX</option>
            </select>
          </div>
        </div>

        <ul id="lista-funcionarios" class="lista-custom mt-4">
          <li><span>A carregar dados...</span></li>
        </ul>

        <a href="create.html" class="btn-novo">Novo Funcionário</a>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>

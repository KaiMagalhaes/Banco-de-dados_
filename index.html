<!doctype html>
<html lang="pt" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Funcionários - Firebase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 class="h1-box">Gestão de Informações dos Funcionários</h1>
    </header>

    <div class="container">
      <div class="header-acoes">
        <h1 class="text-center">Lista de Funcionários</h1>
        <button class="btn btn-success">Ativar Tempo Real</button>
        <div class="busca-bloco">
          <input
            type="text"
            id="searchBar"
            placeholder="Pesquisar funcionário por nome..."
          />
        </div>
        <ul id="lista-funcionarios"></ul>
        <a href="create.html" class="btn-novo">Novo Funcionário</a>
      </div>


      <ul id="lista-funcionarios" class="lista-custom">
        <li><span>A carregar dados...</span></li>
      </ul>
    </div>

    <script type="module" src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
